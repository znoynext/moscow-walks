<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Готовые прогулки по Москве — Пешком.Москва</title>
    <meta name="description" content="Проверенные идеи пеших прогулок по Москве: центр, парки, набережные и архитектура." />
    <link rel="canonical" href="https://znoynext.github.io/moscow-walks/routes/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Готовые прогулки по Москве — Пешком.Москва" />
    <meta property="og:description" content="Проверенные идеи пеших прогулок по Москве: центр, парки, набережные и архитектура." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://znoynext.github.io/moscow-walks/routes/" />
    <meta property="og:image" content="https://znoynext.github.io/moscow-walks/assets/social-preview.svg" />
    <meta property="og:image:alt" content="Пешком.Москва — пешеходные маршруты" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://znoynext.github.io/moscow-walks/assets/social-preview.svg" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../ui-fixes.css" />
  </head>
  <body class="articles-page">
    <header class="articles-header"><a class="articles-brand" href="../">Пешком.Москва</a><a class="back-link" href="../articles/">Что посмотреть</a></header>
    <main class="articles-main">
      <div class="articles-intro"><p class="eyebrow">Готовые сценарии</p><h1>Прогулки, которые можно начать сразу</h1><p class="articles-lead">Выберите настроение и откройте готовую идею. Параметры можно изменить в конструкторе.</p></div>
      <nav class="article-filters" aria-label="Фильтр прогулок"><button class="article-filter is-active" type="button" data-filter="all" aria-pressed="true">Все</button><button class="article-filter" type="button" data-filter="центр" aria-pressed="false">Центр</button><button class="article-filter" type="button" data-filter="парки" aria-pressed="false">Парки</button><button class="article-filter" type="button" data-filter="вода" aria-pressed="false">Вода</button><button class="article-filter" type="button" data-filter="архитектура" aria-pressed="false">Архитектура</button></nav>
      <div id="routeGrid" class="article-grid"></div>
    </main>
    <footer class="site-footer"><a href="../privacy/">Приватность</a><a href="https://github.com/znoynext/moscow-walks">Обратная связь</a></footer>
    <script src="../routes.js"></script>
    <script>
      const grid = document.querySelector("#routeGrid");
      const areaFilters = { center: "центр", parks: "парки", north: "парки", south: "усадьбы" };
      function render(filter = "all") {
        grid.innerHTML = curatedRoutes
          .filter((route) => filter === "all" || route.tags.some((tag) => tag.includes(filter)))
          .map((route, index) => `<article class="article-card"><div class="article-image-wrap"><img class="article-image" src="${routeImages[route.slug]}" alt="${route.title}" loading="lazy" decoding="async" width="1200" height="675" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add('is-broken')" /><span class="article-number">${String(index + 1).padStart(2, "0")}</span></div><div class="article-card-body"><div class="article-card-top"><span class="article-tag">${route.tags.join(" · ")}</span></div><h2>${route.title}</h2><p>${route.description}</p><div class="article-facts"><span><b>Длина</b> около ${route.distance} км</span><span><b>Точки</b> ${route.stops.length}</span></div><div class="article-actions"><a class="article-primary" href="./${route.slug}/">Открыть прогулку</a><a class="article-secondary" href="../?start=${route.start}&distance=${route.distance}&theme=${route.theme}&anchor=${route.anchor}">Изменить маршрут</a></div></div></article>`)
          .join("");
      }
      function selectFilter(filter) {
        document.querySelectorAll(".article-filter").forEach((button) => {
          const isActive = button.dataset.filter === filter;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });
        render(filter);
      }
      document.querySelectorAll(".article-filter").forEach((button) => button.addEventListener("click", () => selectFilter(button.dataset.filter)));
      selectFilter(areaFilters[location.hash.slice(1)] || "all");
    </script>
    <script defer src="../sw-register.js"></script>
  </body>
</html>
