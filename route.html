<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Готовая прогулка — Пешком.Москва</title><link rel="stylesheet" href="./styles.css"></head><body class="articles-page"><header class="articles-header"><a class="articles-brand" href="./">Пешком.Москва</a><a class="back-link" href="./routes/">Все прогулки</a></header><main class="articles-main"><article id="routeDetail" class="article-card"></article></main><footer class="site-footer"><a href="./privacy/">Приватность</a><a href="./routes/">Все прогулки</a></footer><script src="./routes.js"></script><script>
const slug = new URLSearchParams(location.search).get("slug");
const route = routeBySlug[slug];
const card = document.querySelector("#routeDetail");
if (!route) card.innerHTML = '<div class="article-card-body"><h1>Прогулка не найдена</h1><a class="article-primary" href="./routes/">Все прогулки</a></div>';
else card.innerHTML = `<div class="article-card-body"><h1>${route.title}</h1><p>${route.description}</p><p>Старт: м. ${startNames[route.start] || route.start} · около ${route.distance} км</p><ol>${route.stops.map((stop) => `<li>${stop}</li>`).join("")}</ol><div class="article-actions"><a class="article-primary" href="./?start=${route.start}&distance=${route.distance}&theme=${route.theme}&anchor=${route.anchor}">Построить маршрут</a><a class="article-secondary" href="./routes/">Другие прогулки</a></div></div>`;
</script><script defer src="./sw-register.js"></script></body></html>
